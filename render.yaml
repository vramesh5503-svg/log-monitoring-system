services:
  - type: web
    name: log-security-backend
    env: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./logs_security.db
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: http://localhost:5173,https://*.vercel.app
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: Admin@12345
      - key: ADMIN_EMAIL
        value: admin@logsecurity.com
      - key: ALERT_THRESHOLD
        value: "5"
      - key: BRUTE_FORCE_WINDOW
        value: "300"
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"
